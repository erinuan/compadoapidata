name: 定时拉取 Compado 数据

on:
  schedule:
    # 每2小时拉取一次（UTC时间）
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: '指定日期 (YYYY-MM-DD)，留空则拉取昨天'
        required: false
        default: ''

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 获取日期
        id: date
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "TARGET_DATE=${{ github.event.inputs.date }}" >> $GITHUB_OUTPUT
          else
            echo "TARGET_DATE=$(date -d 'yesterday' '+%Y-%m-%d')" >> $GITHUB_OUTPUT
          fi

      - name: 拉取 Compado API
        env:
          COMPADO_USER: ${{ secrets.COMPADO_USER }}
          COMPADO_PASS: ${{ secrets.COMPADO_PASS }}
        run: |
          # 优先使用 secrets，fallback 到默认值
          CUSER="${COMPADO_USER:-gamecookies}"
          CPASS="${COMPADO_PASS:-i6v1NM6LvqyW09LeiSZr}"

          DATE="${{ steps.date.outputs.TARGET_DATE }}"
          echo "拉取日期: $DATE"

          mkdir -p data

          page=1
          page_count=1
          all_items='[]'

          while [ $page -le $page_count ]; do
            url="https://api.compado.com/adsense/clickid-report?user=${CUSER}&password=${CPASS}&start_date=${DATE}&end_date=${DATE}&page=${page}"
            echo "拉取 page=$page ..."
            resp=$(curl -s "$url")

            status_ok=$(echo "$resp" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status',''))" 2>/dev/null)
            if [ "$status_ok" != "ok" ]; then
              echo "API 异常: $(echo $resp | head -c 200)"
              if [ "$page" -eq 1 ]; then echo "首次拉取失败"; exit 0; fi
              break
            fi

            pc=$(echo "$resp" | python3 -c "import sys,json; print(json.load(sys.stdin).get('page_count',0))")
            [ -n "$pc" ] && [ "$pc" -gt 0 ] && page_count=$pc || page_count=0

            items=$(echo "$resp" | python3 -c "
import sys, json
d = json.load(sys.stdin)
print(json.dumps(d.get('click_ids', [])))
")
            if [ "$items" != "[]" ] && [ -n "$items" ]; then
              all_items=$(echo "$all_items" | python3 -c "
import sys, json
e = json.load(sys.stdin)
n = json.loads('$items')
e.extend(n)
print(json.dumps(e))
")
            fi

            page=$((page + 1))
          done

          echo "{\"status\":\"ok\",\"date\":\"$DATE\",\"click_ids\":$all_items}" > "data/${DATE}.json"
          count=$(echo "$all_items" | python3 -c 'import sys,json; print(len(json.load(sys.stdin)))')
          echo "写入 data/${DATE}.json，共 ${count} 条记录"

      - name: 提交并推送
        run: |
          git config user.name "compado-bot"
          git config user.email "compado-bot@github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "无新数据变更"
          else
            git commit -m "chore: 更新 Compado 数据 $(date '+%Y-%m-%d %H:%M')"
            git push
            echo "✅ 已推送数据更新"
          fi
